[build]
	command = "npm run build"
	publish = "dist"

[build.environment]
	NODE_VERSION = "20"
	NPM_FLAGS = "--no-audit --no-fund"

[[headers]]
	for = "/*"
	[headers.values]
		X-Frame-Options = "DENY"
		X-Content-Type-Options = "nosniff"
		Referrer-Policy = "same-origin"

[[headers]]
	for = "/_astro/*"
	[headers.values]
		Cache-Control = "public, max-age=31536000, immutable"
